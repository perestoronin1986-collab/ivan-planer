# Лимит подбора пароля к планеру. Не режем только refresh_token: сервер планера сам
# ходит в /auth/v1/token с IP VPS. Всё прочее POST на token режем — в том числе
# grant_type в закодированном виде (%70assword): $arg_grant_type приходит
# недекодированным, а GoTrue его декодирует, так что белый список password обходился.
map "$request_method:$arg_grant_type" $planer_login_key {
    "POST:refresh_token" "";
    "~^POST:"            $binary_remote_addr;
    default              "";
}
limit_req_zone $planer_login_key zone=planer_login:1m rate=10r/m;
