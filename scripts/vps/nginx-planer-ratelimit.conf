# Лимит подбора пароля к планеру. Лимитируем только вход паролем: сервер планера
# сам ходит в /auth/v1/token за refresh_token с IP VPS — его резать нельзя.
map "$request_method:$arg_grant_type" $planer_login_key {
    "POST:password" $binary_remote_addr;
    default         "";
}
limit_req_zone $planer_login_key zone=planer_login:1m rate=10r/m;
