# plan.afrolatin.ru — планер (Next :3002) и его Supabase на том же домене:
# /auth/v1 → GoTrue :9998, /rest/v1 → PostgREST :3012. Браузер ходит в них сам.
# default_server здесь НЕ ставить — он только в 00-catchall.
server {
    listen 80;
    listen [::]:80;
    server_name plan.afrolatin.ru;
    # Челлендж выше редиректа — иначе продление сертификата упрётся в 301.
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name plan.afrolatin.ru;

    ssl_certificate     /etc/letsencrypt/live/plan.afrolatin.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plan.afrolatin.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # microphone=(self) — голосовой инбокс на /inbox.
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
    proxy_hide_header X-Powered-By;

    client_max_body_size 4m;
    large_client_header_buffers 4 64k;   # фильтры in.(...) в URL; у CRM 414 ловили на ~8 КБ
    proxy_buffer_size 64k;
    proxy_buffers 8 64k;

    # RCE в Image Optimization (GHSA-2xp9-vwfh-vxw4); next/image планер не использует.
    location = /_next/image { return 404; }

    # Админка GoTrue — только изнутри сервера (set-password.sh ходит на 127.0.0.1:9998).
    location ^~ /auth/v1/admin { return 404; }

    location = /auth/v1/token {
        limit_req zone=planer_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:9998/token;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /auth/v1/ {
        proxy_pass http://127.0.0.1:9998/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /rest/v1/ {
        proxy_pass http://127.0.0.1:3012/;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;   # /api/cron/push: maxDuration 60
    }
}
