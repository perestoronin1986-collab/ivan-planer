name: cron-push
# Fallback pinger for /api/cron/push. NOT the primary driver.
#
# Primary: external cron service (cron-job.org) hits the same endpoint every
# 5 minutes with `Authorization: Bearer <CRON_SECRET>`.
# Backstop: vercel.json cron, daily at 06:00 UTC (Vercel Hobby caps crons at
# once per day).
#
# Why this workflow is hourly and not */5:
#   GitHub throttles high-frequency schedules. With "*/5 * * * *" the observed
#   cadence over 831 runs was ~1 run/hour with gaps up to 3 hours, so the
#   5-minute promise was never kept. It also produced runner-capacity noise
#   ("The job was not acquired by Runner of type hosted", 2026-08-06).
#   Hourly is honest about what GitHub actually delivers.
#
# Double-firing is safe: /api/cron/push marks notification.sent_at, so a
# notification already sent by the external cron is skipped here.
#
# Required secrets (Settings -> Secrets -> Actions):
#   CRON_URL    = https://ivan-planer.vercel.app/api/cron/push
#   CRON_SECRET = same as Vercel env var
on:
  schedule:
    # Off the top of the hour — GitHub's scheduler is most congested at :00.
    - cron: "23 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Hit /api/cron/push
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing CRON_URL or CRON_SECRET secret"
            exit 1
          fi
          # Not `curl -f`: it swallows both the status code and the body, so a
          # failure surfaced only as "exit code 22" and told us nothing about
          # whether the secret was wrong (401) or the endpoint blew up (500).
          body=$(curl -sS -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -w "\n%{http_code}" \
            "$CRON_URL")
          code=${body##*$'\n'}
          echo "HTTP $code"
          echo "${body%$'\n'*}"
          if [ "$code" != "200" ]; then
            echo "::error::/api/cron/push returned $code"
            exit 1
          fi
